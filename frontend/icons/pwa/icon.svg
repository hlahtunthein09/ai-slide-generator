<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2a"/>
      <stop offset="100%" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74eee4"/>
      <stop offset="100%" stop-color="#58d8d1"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#58d8d1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#58d8d1" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Presentation Screen / Slide Frame -->
  <g filter="url(#cyanGlow)">
    <rect x="80" y="96" width="352" height="236" rx="20" fill="#0d283c" stroke="url(#cyanGrad)" stroke-width="10"/>

    <!-- Slide Header -->
    <rect x="116" y="132" width="140" height="18" rx="4" fill="url(#cyanGrad)"/>

    <!-- Slide Bullets & Content lines -->
    <!-- Line 1 -->
    <circle cx="126" cy="180" r="8" fill="#58d8d1"/>
    <rect x="150" y="174" width="140" height="12" rx="3" fill="#f2fbf9"/>

    <!-- Line 2 -->
    <circle cx="126" cy="216" r="8" fill="#58d8d1"/>
    <rect x="150" y="210" width="176" height="12" rx="3" fill="#85a4aa"/>

    <!-- Line 3 -->
    <circle cx="126" cy="252" r="8" fill="#58d8d1"/>
    <rect x="150" y="246" width="120" height="12" rx="3" fill="#85a4aa"/>

    <!-- AI Sparkle Emblem on Slide -->
    <path d="M365 160 L373 186 L399 194 L373 202 L365 228 L357 202 L331 194 L357 186 Z" fill="url(#cyanGrad)"/>
    <circle cx="330" cy="155" r="4" fill="#74eee4"/>
  </g>

  <!-- Easel Stand Stem & Legs -->
  <line x1="256" y1="332" x2="256" y2="400" stroke="#58d8d1" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="400" x2="140" y2="446" stroke="#58d8d1" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="400" x2="372" y2="446" stroke="#58d8d1" stroke-width="12" stroke-linecap="round"/>
</svg>
